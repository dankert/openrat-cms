    name: OpenRat CMS API support
webhooks:
  userCreated:
    post:
      summary: >
        Wird ausgelöst, wenn ein neuer Benutzer
        registriert wird
      description: >
        Dein Server sendet dieses Event an die
        konfigurierte Webhook-URL des Clients.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        200:
          description: >
            Client hat das Event erfolgreich
            verarbeitet und bestätigt.
servers:
  - 
    url: //demo.openrat.de
    description: OpenRat Demo
  - 
    url: //localhost:8000/rest
    description: OpenRat local development
  - 
    url: //localhost:8090
    description: OpenRat local development
