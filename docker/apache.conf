<VirtualHost *:8080>
  DocumentRoot /var/www/localhost/cms
  Alias "/rest" "/var/www/localhost/cms/api/api.php"
</VirtualHost>

# Virtual host with API for CMS
<VirtualHost *:8090>
  DocumentRoot /var/www/localhost/cms
  # 1. Rewrite Engine aktivieren
  RewriteEngine On
  RewriteRule ^/([^/]+)/([^/]+)/([^/]+)/?$ /index.php?action=$1&id=$2&subaction=$3&api=1 [QSA,L]
  RewriteRule ^ - [R=404,L]
</VirtualHost>

<Directory "/var/www/localhost/cms">
  AllowOverride None
  Options None
  Require all granted
</Directory>



# Virtual host for generated pages
<VirtualHost *:8081>
  DocumentRoot /var/www/localhost/public
  php_value engine off
</VirtualHost>
# Virtual host for multiple domains
<VirtualHost *:8082>
  UseCanonicalName    Off
  VirtualDocumentRoot /var/www/localhost/public/%0
  php_value engine off
</VirtualHost>

# Directory configuration
<Directory "/var/www/localhost/public">
  Options Indexes
  AllowOverride None
  Require all granted
</Directory>
