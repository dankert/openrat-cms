name: Build and Push Docker Image via Buildah

on:
  push:
    branches:
      - master
    tags:
      - '[0-9]+.[0-9]+.[0-9]+' # Reagiert exakt auf x.y.z Tags

jobs:
  build-and-push:
    runs-on: docker
    env:
      BUILDAH_ISOLATION: chroot
    container:
      image: quay.io/buildah/stable:v1.38
      options: |
        --privileged
        --security-opt seccomp=unconfined
        --security-opt apparmor=unconfined
        -v ${{ github.workspace }}:${{ github.workspace }}

    steps:
      # SCHRITT 1: Code direkt über die lokale Forgejo-Instanz klonen
      - name: Clone Code from Local Forgejo
        env:
          REPO_URL: "code.openrat.de/${{ github.repository }}.git"
          AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Git im Buildah-Container nachinstallieren (dnf ist im RedHat-Image vorhanden)
          dnf install -y git
          
          # Wir setzen die Umgebungsvariablen nun korrekt im Befehl ein
          git clone --depth 1 "https://x-access-token:$AUTH_TOKEN@$REPO_URL" .
          
          # Wir checken exakt den Commit aus, der den Push ausgelöst hat
          git checkout ${{ github.sha }}

          
      # Generiert die korrekten Tags für Branches (inkl. latest für master/main) und Git-Tags
      - name: Determine Docker Tags
        id: tags
        run: |
          FORGEJO_REPO="code.openrat.de/dankert/test"
          DOCKERHUB_REPO="${{ secrets.DOCKERHUB_USERNAME }}/test"
          
          TAGS=""
          
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # Wenn es ein Git-Tag (x.y.z) ist:
            VERSION="${{ github.ref_name }}"
            SHORT_VERSION=$(echo "$VERSION" | cut -d. -f1,2)
            
            TAGS="$TAGS -t $FORGEJO_REPO:$VERSION -t $DOCKERHUB_REPO:$VERSION"
            TAGS="$TAGS -t $FORGEJO_REPO:$SHORT_VERSION -t $DOCKERHUB_REPO:$SHORT_VERSION"
            TAGS="$TAGS -t $FORGEJO_REPO:latest -t $DOCKERHUB_REPO:latest"
          else
            # Wenn es ein Branch-Push (main oder master) ist:
            BRANCH="${{ github.ref_name }}"
            
            TAGS="$TAGS -t $FORGEJO_REPO:$BRANCH -t $DOCKERHUB_REPO:$BRANCH"
            # Zusätzlich das 'latest'-Tag vergeben
            TAGS="$TAGS -t $FORGEJO_REPO:latest -t $DOCKERHUB_REPO:latest"
          fi
          
          echo "docker_tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Log in to Forgejo Registry
        run: buildah login -u forgejo -p ${{ secrets.GITHUB_TOKEN }} code.openrat.de

      - name: Log in to Docker Hub
        run: buildah login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }} docker.io

      - name: Build Image with Buildah
        run: buildah bud ${{ steps.tags.outputs.docker_tags }} .

      - name: Push Image to Registries
        run: buildah push --all
